name: CI/CD - Cadastro de Clientes

on:
  push:
    branches:
      - desenvolvimento
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  testes:
    name: Testes unitários
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Executar testes unitários
        run: node --test

  build-deploy:
    name: Build, publicação e deploy na AWS
    needs: testes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cadastro-clientes-ci-cd:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cadastro-clientes-ci-cd:${{ github.sha }}

      - name: Preparar acesso SSH à EC2
        env:
          EC2_SSH_KEY: ${{ secrets.AWS_EC2_SSH_KEY }}
          EC2_HOST: ${{ vars.AWS_EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Fazer deploy na Amazon EC2
        env:
          EC2_HOST: ${{ vars.AWS_EC2_HOST }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cadastro-clientes-ci-cd:${{ github.sha }}
        run: |
          ssh -i ~/.ssh/ec2_key "ec2-user@$EC2_HOST" \
            "sudo docker pull '$IMAGE' && \
             (sudo docker rm -f cadastro-clientes || true) && \
             sudo docker run -d \
               --name cadastro-clientes \
               --restart unless-stopped \
               -p 80:80 \
               '$IMAGE'"